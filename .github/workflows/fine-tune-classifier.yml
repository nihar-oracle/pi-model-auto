name: Fine-tune cost-sensitive classifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fine-tune:
    name: risk-${{ matrix.risk_lambda }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        risk_lambda: [0.25, 0.5, 1.0]
    env:
      HF_HOME: /tmp/huggingface
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.8.0' \
            'transformers==4.57.6' \
            'datasets>=3,<5' \
            'accelerate>=1,<2' \
            'scikit-learn>=1.6,<2' \
            'optimum[onnxruntime]==2.1.0' \
            'onnxruntime>=1.23,<2'
      - name: Fine-tune and export INT8 ONNX
        run: >-
          python training/train_cost_sensitive.py
          --risk-lambda ${{ matrix.risk_lambda }}
          --output "${{ runner.temp }}/risk-${{ matrix.risk_lambda }}"
      - uses: actions/upload-artifact@v4
        with:
          name: classifier-risk-${{ matrix.risk_lambda }}
          path: |
            ${{ runner.temp }}/risk-${{ matrix.risk_lambda }}/classifier
            ${{ runner.temp }}/risk-${{ matrix.risk_lambda }}/metrics.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
